name: hourly-forecast
# BACKUP TRIGGER (best-effort GitHub cron). Primary is the hourly-keeper workflow, which fires at :00 ET.
# Each backup run (1) restarts the keeper if none is running/queued, (2) runs the forecaster;
# duplicates are skipped by the asset+forecast_hour key, so a late backup run only fills gaps.
# schedule registered 2026-11-18 21:12 ET
# FORECASTING ONLY: public Kraken market data, no API keys, no trading.
on:
  schedule:
    - cron: "0 * * * *"    # primary: minute 00 every hour (00 UTC == 00 America/New_York, whole-hour offset)
    - cron: "10 * * * *"   # backup triggers: recover a delayed/dropped :00 run;
    - cron: "25 * * * *"   # duplicates are skipped by the asset+forecast_hour key
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "manual trigger reason"
        required: false
        default: "manual"
concurrency:
  group: forecaster-run-lock      # run lock: one execution at a time, never cancelled mid-run
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Ensure primary keeper is alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alive=$(gh run list --repo "${{ github.repository }}" --workflow keeper.yml --limit 20 --json status --jq '[.[]|select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")]|length' || echo 1)
          echo "live keeper runs: $alive"
          if [ "$alive" = "0" ]; then gh workflow run keeper.yml --repo "${{ github.repository }}" --ref main -f reason="restarted by backup cron ${{ github.run_id }}"; echo "keeper re-dispatched"; fi
      - name: Run forecaster and commit (retries + push-race safe)
        run: |
          TZ=America/New_York date '+fired at %Y-%m-%d %H:%M:%S %Z'
          bash forecaster/run_and_commit.sh "${{ github.event_name }}:${{ github.event.schedule || inputs.reason }}" "${{ github.run_id }}"
